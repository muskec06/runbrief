name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pytest
      - name: tests
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          python -m pytest -q -rfE --durations=5 tests/ 2>&1 | tee pytest.log
      - name: report failures (visible without signing in)
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) |^E   " pytest.log | head -20 | while IFS= read -r l; do
            l="${l//'%'/'%25'}"; echo "::error title=pytest ${{ matrix.os }} ${{ matrix.python }}::${l}"
          done
          { echo "### pytest output (last 80 lines)"; echo '```'; tail -80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - run: python3 -m pip install pytest
      - run: python3 bench/run_bench.py --out bench/results-ci
      - uses: actions/upload-artifact@v6
        with: { name: bench-results, path: bench/results-ci }
